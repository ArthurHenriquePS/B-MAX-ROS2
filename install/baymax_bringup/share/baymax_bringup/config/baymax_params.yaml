# Parâmetros centrais do Baymax. Carregue com:
#   ros2 launch baymax_bringup baymax.launch.py
# ou aponte nós individuais para este arquivo via --params-file.

brain_node:
  ros__parameters:
    model: "qwen2.5:3b"
    ollama_url: "http://127.0.0.1:11434"
    temperature: 0.6
    offline_fallback: true

motor_bridge_node:
  ros__parameters:
    head_port: "/dev/ttyUSB0"
    arm_port: "/dev/ttyUSB1"
    baud: 115200
    simulate: true

vision_node:
  ros__parameters:
    camera_index: 0
    rate_hz: 2.0
    enabled: false

stt_node:
  ros__parameters:
    model: "base"                       # base: ~330ms/3.3s (RTF 0.10). small é 3.5x mais lento sem ganho
    models_dir: "/home/icbaymax/baymax_ws/models/whisper"
    language: "pt"
    n_threads: 8

tts_node:
  ros__parameters:
    voice: "/home/icbaymax/baymax_ws/models/pt_BR-faber-medium.onnx"
    audio_device: "plughw:1,0"   # placa analógica (card 1). "" = default do sistema
    player: "aplay"
    enabled: true
